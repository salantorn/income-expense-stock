services:
  # Backend API
  - type: web
    name: income-expense-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: income-expense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://income-expense-frontend.onrender.com
      - key: PORT
        value: 3000

  # Frontend
  - type: web
    name: income-expense-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://income-expense-backend.onrender.com

databases:
  # PostgreSQL Database
  - name: income-expense-db
    plan: free
    region: singapore
